# vim:set ft=tmux:
%hidden MODULE_NAME="nest"

# A badge that appears ONLY when the current tmux is remote or nested, and is
# empty otherwise. Detection priority: remote (SSH) > nested-local > nothing.
#
# - remote:  the tmux server was started inside an SSH session, so SSH_CONNECTION
#            is in its environment. Shows the short hostname so that stacked
#            status bars from different hosts are instantly distinguishable.
#            SSH_CONNECTION is used (not SSH_TTY) because ssh always sets it
#            and tmux keeps it fresh via `update-environment`.
# - nested:  not SSH, but $TMUX is set — this server was started from inside
#            another tmux (a genuinely nested, different-socket server).
#
# Both signals are read straight from the environment, so the badge is empty on
# a plain local top-level session with zero configuration.

# === User-configurable options ===
# Icons carry their own trailing space (like the cpu/host modules) so the icon
# and text stay separated even when a user overrides the text.
set -ogq "@gruvbox_${MODULE_NAME}_remote_icon" "󰣀 "
set -ogq "@gruvbox_${MODULE_NAME}_remote_text" "#h"
set -ogq "@gruvbox_${MODULE_NAME}_nested_icon" "󰪥"
set -ogq "@gruvbox_${MODULE_NAME}_nested_text" ""

# Colors: use -ogqF so #{@thm_*} resolve to hex at config time
# (#{E:...} only does one expansion pass).
set -ogqF "@gruvbox_${MODULE_NAME}_remote_color" "#{@thm_red}"
set -ogqF "@gruvbox_${MODULE_NAME}_nested_color" "#{@thm_aqua}"

# === Internal: build conditional output (modeled on prefix_highlight.conf) ===
# IMPORTANT: use separate #[fg=X]#[bg=Y] tags, NOT combined #[fg=X,bg=Y] —
# combined style tags break inside tmux conditionals (the comma collides with
# the #{?...} separator).
set -gqF @_grv_nest_fg "#{@thm_bg_dim}"

set -gqF @_grv_nest_remote \
  "#[fg=#{@_grv_nest_fg}]#[bg=#{@gruvbox_nest_remote_color}]#[bold] #{@gruvbox_nest_remote_icon}#{@gruvbox_nest_remote_text} #[default]"
set -gqF @_grv_nest_nested \
  "#[fg=#{@_grv_nest_fg}]#[bg=#{@gruvbox_nest_nested_color}]#[bold] #{@gruvbox_nest_nested_icon}#{@gruvbox_nest_nested_text} #[default]"

# Assemble. -gqF expands #{@_grv_nest_*} and converts ## -> #, so ##{?...}
# becomes #{?...} for evaluation at status-render time.
set -gqF "@gruvbox_status_${MODULE_NAME}" \
  "##{?SSH_CONNECTION,#{@_grv_nest_remote},##{?TMUX,#{@_grv_nest_nested},}}"

set -ug @_grv_nest_fg
set -ug @_grv_nest_remote
set -ug @_grv_nest_nested
